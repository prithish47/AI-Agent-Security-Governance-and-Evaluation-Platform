# A generic, single database configuration.

[alembic]
# Path to migration scripts.
# Use forward slashes even on Windows.
script_location = migrations

# SQLAlchemy URL — overridden by env.py at runtime
# This is a placeholder; the actual URL comes from app.core.config.settings
sqlalchemy.url = postgresql+asyncpg://agentguard:agentguard_dev_password@localhost:5432/agentguard

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
